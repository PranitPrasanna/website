<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>

  <!-- Styles and font -->
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Disable scrolling */
      height: 100%;
      width: 100%;
      background: black;
      font-family: 'Orbitron', sans-serif;
    }

    /* Star field and centered title */
    #star-container {
      position: fixed;
      top: 80px; /* Adjust based on your navbar height */
      left: 0;
      width: 100%;
      height: 40vh;
      pointer-events: none;
      z-index: 1;
    }

    .circle {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: glowPulse 2.5s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0% {
        transform: scale(0.8);
        opacity: 0.2;
      }
      50% {
        transform: scale(1.8);
        opacity: 1;
      }
      100% {
        transform: scale(0.8);
        opacity: 0.2;
      }
    }

    #star-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: white;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar_container">
      <a href="index.html" id="logo"><img src="/Users/pranitprasanna/Downloads/ChatGPT Image Jun 14, 2025, 01_53_26 PM.png" alt="Logo"></a>
      <a href="/" id="navbar_toggle" id="desktop-menu"></a>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
    <ul class="navbar_menu">
      <li class="navbar_item">
        <a onclick="location.href = 'contact.html'" class="navbar_links">Contact</a>
      </li>
      <li class="navbar_item">
        <a onclick="location.href = 'about.html'" class="navbar_links">About</a>
      </li>
      <li class="navbar_item">
        <a onclick="location.href = 'donate.html'" class="button">Donate</a>
      </li>
    </ul>
  </nav>

  <!-- Pulsing stars and center text -->
  <div id="star-container">
    <div id="star-title">
      <img src="title-tech.svg?v=4" alt="Title" style="width: 450px; height: auto;">
    </div>
  </div>

  <!-- 3D Wave Plane -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 40);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const width = 200;
    const height = 60;
    const segments = 50;

    const geometry = new THREE.PlaneGeometry(width, height, segments, segments);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const plane = new THREE.Mesh(geometry, material);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -7;
    scene.add(plane);

    const posAttr = geometry.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      const z = Math.sin(x * 0.1 + y * 0.1) * 3 + Math.cos(x * 0.1 - y * 0.1) * 2;
      posAttr.setZ(i, z);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;

      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const z = Math.sin(x * 0.1 + time) * 3 + Math.cos(y * 0.1 + time) * 2;
        posAttr.setZ(i, z);
      }

      posAttr.needsUpdate = true;
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <!-- Pulsing star generator -->
  <script>
    const container = document.getElementById('star-container');
    const circleCount = 50;

    function createStars() {
      const containerHeight = container.offsetHeight;
      // Clear only the circles, preserve the star-title content
      const circles = container.querySelectorAll('.circle');
      circles.forEach(circle => circle.remove());

      for (let i = 0; i < circleCount; i++) {
        const circle = document.createElement('div');
        circle.classList.add('circle');

        const size = 3 + Math.random() * 4;
        circle.style.width = `${size}px`;
        circle.style.height = `${size}px`;

        circle.style.top = `${Math.random() * containerHeight}px`;
        circle.style.left = `${Math.random() * window.innerWidth}px`;

        circle.style.animationDelay = `${Math.random() * 2}s`;
        container.appendChild(circle);
      }
    }

    createStars();
    window.addEventListener('resize', createStars);
  </script>
</body>
</html>
