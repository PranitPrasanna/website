</head>
<body>
    <div class="circuit-background">
        <svg class="circuit-pattern" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="circuit" x="0" y="0" width="250" height="250" patternUnits="userSpaceOnUse">
                    <!-- Gradient definitions for metallic effect -->
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#b0b0b0;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#e0e0e0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- PCB-style circuit board design -->
                    <g>
                        <!-- Realistic PCB circuit traces -->
                        <path d="M 0 60 L 40 60 L 40 30 L 90 30 L 90 60 L 140 60 L 140 20 L 180 20 L 180 80 L 250 80" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 20 0 L 20 40 L 60 40 L 60 90 L 30 90 L 30 140 L 80 140 L 80 180 L 50 180 L 50 250" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 250 120 L 200 120 L 200 90 L 160 90 L 160 140 L 120 140 L 120 110 L 90 110 L 90 160 L 130 160 L 130 200 L 100 200 L 100 250" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 0 200 L 40 200 L 40 160 L 90 160" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 180 80 L 180 120 L 200 120" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 60 90 L 120 90 L 120 60" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 160 140 L 160 180 L 130 180 L 130 160" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 80 140 L 80 110 L 90 110" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 140 0 L 140 20" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 200 250 L 200 200 L 160 200 L 160 180" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        <path d="M 30 140 L 0 140" stroke="#c0c0c0" stroke-width="2.5" fill="none"/>
                        
                        <!-- Glowing filter for nodes -->
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        
                        <!-- Radial gradient for shiny nodes -->
                        <radialGradient id="greenShine">
                            <stop offset="0%" style="stop-color:#80ff80;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#00ff41;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#00cc33;stop-opacity:1" />
                        </radialGradient>
                        
                        <!-- Junction points removed - only moving signals remain -->
                        
                        <!-- Electronic components positioned on circuit traces -->
                        <!-- Resistors on horizontal traces -->
                        <rect x="60" y="27" width="20" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="110" y="57" width="20" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="160" y="17" width="15" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="210" y="77" width="20" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="170" y="117" width="20" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="100" y="107" width="15" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="140" y="157" width="20" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="15" y="197" width="20" height="6" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        
                        <!-- Resistors on vertical traces -->
                        <rect x="17" y="15" width="6" height="20" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="57" y="55" width="6" height="25" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="27" y="105" width="6" height="25" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="77" y="150" width="6" height="20" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="47" y="200" width="6" height="30" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="97" y="180" width="6" height="20" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="157" y="105" width="6" height="25" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="127" y="170" width="6" height="20" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        <rect x="197" y="95" width="6" height="20" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
                        
                        <!-- IC chips on trace junctions -->
                        <rect x="35" y="55" width="15" height="15" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
                        <rect x="85" y="85" width="20" height="15" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
                        <rect x="115" y="135" width="15" height="15" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
                        <rect x="65" y="135" width="20" height="15" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
                        <rect x="175" y="75" width="15" height="15" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
                        
                        <!-- Capacitors (cylindrical) -->
                        <ellipse cx="45" cy="90" rx="8" ry="4" fill="#4169E1" stroke="#000" stroke-width="0.5"/>
                        <ellipse cx="105" cy="140" rx="8" ry="4" fill="#4169E1" stroke="#000" stroke-width="0.5"/>
                        <ellipse cx="150" cy="90" rx="8" ry="4" fill="#4169E1" stroke="#000" stroke-width="0.5"/>
                        <ellipse cx="180" cy="180" rx="8" ry="4" fill="#4169E1" stroke="#000" stroke-width="0.5"/>
                    </g>
                    
                    <!-- Moving electrical signals following actual circuit paths -->
                    <circle class="signal signal1" cx="0" cy="0" r="3" fill="#00ff41" filter="url(#glow)">
                        <animateMotion dur="6s" repeatCount="indefinite" begin="0s">
                            <mpath href="#circuitPath1"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal2" cx="0" cy="0" r="3" fill="#00ff41" filter="url(#glow)">
                        <animateMotion dur="6s" repeatCount="indefinite" begin="2s">
                            <mpath href="#circuitPath1"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal3" cx="0" cy="0" r="3" fill="#00ff41" filter="url(#glow)">
                        <animateMotion dur="6s" repeatCount="indefinite" begin="4s">
                            <mpath href="#circuitPath1"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal4" cx="0" cy="0" r="3" fill="#00ff41" filter="url(#glow)">
                        <animateMotion dur="7s" repeatCount="indefinite" begin="0s">
                            <mpath href="#circuitPath2"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal5" cx="0" cy="0" r="3" fill="#00ff41" filter="url(#glow)">
                        <animateMotion dur="7s" repeatCount="indefinite" begin="3.5s">
                            <mpath href="#circuitPath2"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal6" cx="0" cy="0" r="3" fill="#00ff41" filter="url(#glow)">
                        <animateMotion dur="8s" repeatCount="indefinite" begin="1s">
                            <mpath href="#circuitPath3"/>
                        </animateMotion>
                    </circle>
                    
                    <!-- Define actual circuit animation paths that EXACTLY follow the PCB traces -->
                    <!-- Path 1: follows first trace exactly -->
                    <path id="circuitPath1" d="M 0 60 L 40 60 L 40 30 L 90 30 L 90 60 L 120 60 L 120 90 L 60 90 L 60 40 L 20 40 L 20 0" fill="none"/>
                    <!-- Path 2: follows interconnected traces -->
                    <path id="circuitPath2" d="M 140 0 L 140 20 L 180 20 L 180 80 L 180 120 L 200 120 L 200 90 L 160 90 L 160 140 L 120 140 L 120 110 L 90 110 L 90 160 L 40 160 L 40 200 L 0 200" fill="none"/>
                    <!-- Path 3: another complete circuit through the traces -->
                    <path id="circuitPath3" d="M 30 140 L 80 140 L 80 180 L 50 180 L 50 250 L 100 250 L 100 200 L 130 200 L 130 160 L 160 160 L 160 180 L 200 180 L 200 250" fill="none"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#circuit)"/>
        </svg>
    </div>
    <div class="card">
    </div>
</body>
