<body>
    <div class="circuit-background">
        <svg class="circuit-pattern" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="circuit" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                    <!-- Circuit paths -->
                    <path d="M 50 0 L 50 50 L 100 50" stroke="#00ff41" stroke-width="2" fill="none"/>
                    <path d="M 150 0 L 150 100 L 200 100" stroke="#00ff41" stroke-width="2" fill="none"/>
                    <path d="M 0 150 L 50 150 L 50 200" stroke="#00ff41" stroke-width="2" fill="none"/>
                    <path d="M 100 100 L 100 150 L 150 150" stroke="#00ff41" stroke-width="2" fill="none"/>
                    <path d="M 0 50 L 50 50" stroke="#00ff41" stroke-width="2" fill="none"/>
                    <path d="M 150 150 L 200 150" stroke="#00ff41" stroke-width="2" fill="none"/>
                    
                    <!-- Circuit nodes -->
                    <circle cx="50" cy="50" r="4" fill="#00ff41"/>
                    <circle cx="150" cy="100" r="4" fill="#00ff41"/>
                    <circle cx="100" cy="150" r="4" fill="#00ff41"/>
                    <circle cx="50" cy="150" r="4" fill="#00ff41"/>
                    <circle cx="150" cy="150" r="4" fill="#00ff41"/>
                    <circle cx="100" cy="50" r="3" fill="#00ff41"/>
                    
                    <!-- Moving electrical signals (continuous one-way paths) -->
                    <circle class="signal signal1" cx="0" cy="0" r="4" fill="#ffffff">
                        <animateMotion dur="4s" repeatCount="indefinite" begin="0s">
                            <mpath href="#path1"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal2" cx="0" cy="0" r="4" fill="#ffffff">
                        <animateMotion dur="4s" repeatCount="indefinite" begin="2s">
                            <mpath href="#path1"/>
                        </animateMotion>
                    </circle>
                    <circle class="signal signal3" cx="0" cy="0" r="4" fill="#ffffff">
                        <animateMotion dur="5s" repeatCount="indefinite" begin="0s">
                            <mpath href="#path2"/>
                        </animateMotion>
                    </circle>
                    
                    <!-- Define continuous one-way paths for signals -->
                    <path id="path1" d="M -50 50 L 0 50 L 50 50 L 100 50 L 150 50 L 200 50 L 250 50" fill="none"/>
                    <path id="path2" d="M 150 -50 L 150 0 L 150 50 L 150 100 L 150 150 L 150 200 L 150 250" fill="none"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#circuit)"/>
        </svg>
    </div>

    </div>
