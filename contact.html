<body>
    <div class="contact-page-container">
        <!-- Contact Form Container (Left) -->
        <div class="contact-container">
            <h1 id="title">Contact Us</h1>
            
            <form class="form" id="contactForm">
            <label for="firstName">First Name*</label><br>
            <input type="text" id="firstName" name="firstName" required><br><br>

            <label for="lastName">Last Name</label><br>
            <input type="text" id="lastName" name="lastName"><br><br>
          
            <label for="email">Email*</label><br>
            <input type="email" id="email" name="email" required><br><br>
          
            <label for="message">Message*</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br><br>
          
            <button class="contact_submit" type="submit">Submit</button>
        </form>
        
        <div id="responseMessage" style="display: none; color: white; margin-top: 20px; padding: 15px; border-radius: 5px;"></div>
        </div>
        
        <!-- Newton's Cradle Container (Right) -->
        <div class="newtons-cradle-container sticky" id="newtonsCradle"></div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            const responseDiv = document.getElementById('responseMessage');
            
            try {
                const response = await fetch('/api/contact/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                
                if (data.success) {
                    responseDiv.style.display = 'block';
                    responseDiv.style.backgroundColor = 'rgba(0, 128, 0, 0.5)';
                    responseDiv.textContent = data.message;
                    
                    // Clear the form
                    document.getElementById('contactForm').reset();
                    
                    // Hide message after 5 seconds
                    setTimeout(() => {
                        responseDiv.style.display = 'none';
                    }, 5000);
                } else {
                    responseDiv.style.display = 'block';
                    responseDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.5)';
                    responseDiv.textContent = data.message || 'An error occurred. Please try again.';
                }
            } catch (error) {
                console.error('Error:', error);
                responseDiv.style.display = 'block';
                responseDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.5)';
                responseDiv.textContent = 'Network error. Please try again later.';
            }
        });
    </script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Tetrahedron Three.js Implementation -->
    <script>
        // Initialize Three.js scene
        const container = document.getElementById('newtonsCradle');
        const scene = new THREE.Scene();
        scene.background = null; // Transparent background
        
        const camera = new THREE.PerspectiveCamera(
            45,
            400 / 400,
            0.1,
            1000
        );
        camera.position.set(0, 0.5, 4.5);
        camera.lookAt(0, 2.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ 
            alpha: true,
            antialias: true 
        });
        renderer.setSize(400, 400);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        
        // Lighting (60 degrees south of east = 150 degrees)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(-2, 3, 2); // Light from 150 degree angle
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 20;
        directionalLight.shadow.camera.left = -5;
        directionalLight.shadow.camera.right = 5;
        directionalLight.shadow.camera.top = 5;
        directionalLight.shadow.camera.bottom = -5;
        scene.add(directionalLight);
        
        // Metal presets
        const metals = {
            chrome: { color: 0xffffff, metalness: 1.0, roughness: 0.0 },
            gold: { color: 0xFFD700, metalness: 1.0, roughness: 0.1 },
            silver: { color: 0xC0C0C0, metalness: 1.0, roughness: 0.05 },
            copper: { color: 0xB87333, metalness: 1.0, roughness: 0.2 },
            bronze: { color: 0xCD7F32, metalness: 1.0, roughness: 0.3 },
            brass: { color: 0xB5651D, metalness: 1.0, roughness: 0.25 },
            aluminum: { color: 0xD3D3D3, metalness: 1.0, roughness: 0.15 },
            iron: { color: 0x434343, metalness: 1.0, roughness: 0.4 },
            steel: { color: 0x71797E, metalness: 1.0, roughness: 0.2 },
            titanium: { color: 0x878681, metalness: 1.0, roughness: 0.1 },
            platinum: { color: 0xE5E4E2, metalness: 1.0, roughness: 0.05 },
            gunmetal: { color: 0x2C3539, metalness: 1.0, roughness: 0.35 }
        };
        
        // Select metal type (change this to any metal from above)
        const selectedMetal = metals.gunmetal; // Options: chrome, gold, silver, copper, bronze, brass, aluminum, iron, steel, titanium, platinum, gunmetal
        
        // Create metallic material
        const tetrahedronMaterial = new THREE.MeshStandardMaterial({
            color: selectedMetal.color,
            metalness: selectedMetal.metalness,
            roughness: selectedMetal.roughness,
            envMapIntensity: 1.0
        });
        
        // Create a simple environment map using a render target
        const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
        const cubeCamera = new THREE.CubeCamera(0.1, 10, cubeRenderTarget);
        
        // Generate environment map
        const generateEnvMap = () => {
            // Create temporary scene for environment
            const envScene = new THREE.Scene();
            
            // Add gradient background
            const skyGeometry = new THREE.SphereGeometry(5, 32, 32);
            const skyMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0xffffff) },
                    bottomColor: { value: new THREE.Color(0x888888) },
                    offset: { value: 0 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + offset).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            envScene.add(sky);
            
            // Render environment to cube texture
            cubeCamera.position.copy(tetrahedron.position);
            cubeCamera.update(renderer, envScene);
            
            // Apply environment map to material
            tetrahedronMaterial.envMap = cubeRenderTarget.texture;
            tetrahedronMaterial.needsUpdate = true;
        };
        
        // Call after renderer is created
        setTimeout(generateEnvMap, 100);
        
        // Add point lights for better reflections
        const pointLight1 = new THREE.PointLight(0xffffff, 1, 100);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0xffffff, 0.5, 100);
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);
        
        // Create icosahedron (more visually interesting than basic tetrahedron)
        const tetrahedronGeometry = new THREE.IcosahedronGeometry(1.8, 0);
        const tetrahedron = new THREE.Mesh(tetrahedronGeometry, tetrahedronMaterial);
        tetrahedron.position.y = 2.5; // Move up even higher
        tetrahedron.castShadow = true;
        tetrahedron.receiveShadow = true;
        scene.add(tetrahedron);
        
        // Add ground shadow plane
        const shadowGeometry = new THREE.PlaneGeometry(10, 10);
        const shadowMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
        const shadowPlane = new THREE.Mesh(shadowGeometry, shadowMaterial);
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -1;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate the tetrahedron slower
            tetrahedron.rotation.x += 0.005;
            tetrahedron.rotation.y += 0.008;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const width = 400;
            const height = 400;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
